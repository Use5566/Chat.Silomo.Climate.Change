<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Silomo</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main:     #2d5a3d;
      --bg-deep:     #1e3d2a;
      --cream:       #fdf8f2;
      --warm-white:  #ffffff;
      --text-dark:   #2d1f0e;
      --text-mid:    #6b5240;
      --text-muted:  #a08870;
      --user-bubble: #fde9b8;
      --ai-bubble:   #ffffff;
      --shadow-soft: 0 2px 12px rgba(20,50,30,0.18);
      --shadow-card: 0 8px 32px rgba(20,50,30,0.28);
      --green-mid:   #3d7a52;
      --green-light: #4a9463;
    }

    body {
      font-family: 'Noto Sans TC', 'Nunito', sans-serif;
      background: var(--bg-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px; /* 為了讓 iPad 上有邊距感 */
    }

    /* ══════════════ LOGIN ══════════════ */
    #login-screen {
      width: 100%;
      max-width: 650px; /* 加寬以適應 16:9 iPad */
      background: var(--warm-white);
      border-radius: 28px;
      padding: 36px 48px; /* 稍微減少上下 padding，增加左右 padding */
      box-shadow: var(--shadow-card);
      animation: fadeUp 0.55s cubic-bezier(.22,1,.36,1) both;
      position: relative;
      overflow: hidden;
    }
    #login-screen::before {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 160px; height: 160px; background: radial-gradient(circle, #e8f5ee 0%, transparent 70%);
      border-radius: 50%; pointer-events: none;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(28px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    .login-hero {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 16px; /* 減少高度佔用 */
    }
    
    .avatar-icon-lg {
      width: 70px; height: 70px; /* 稍微縮小一點 */
      background: var(--green-light); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(61,122,82,0.3); padding: 8px;
    }

    .login-hero h1 {
      font-family: 'Nunito', sans-serif; font-size: 1.8rem; font-weight: 800;
      color: var(--text-dark); margin-top: 12px; letter-spacing: -0.02em;
    }
    .login-hero h1 span { color: var(--green-mid); }
    
    .login-hero h2 {
      font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: 700;
      color: var(--green-light); margin-top: 2px; letter-spacing: 0.02em;
    }
    
    .login-hero p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .field-label {
      font-size: 0.75rem; font-weight: 700; color: var(--text-mid);
      letter-spacing: 0.07em; text-transform: uppercase;
      margin-bottom: 6px; margin-top: 14px; display: block; /* 減少 margin-top */
    }

    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .sel-btn {
      padding: 7px 18px; border: 1.5px solid #e8d5bb; border-radius: 20px;
      background: var(--cream); color: var(--text-mid); font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s; flex-grow: 1; /* 讓按鈕平均分配寬度 */
      text-align: center;
    }
    .sel-btn:hover { border-color: var(--green-mid); color: var(--green-mid); background: #e8f5ee; }
    .sel-btn.active { background: var(--green-mid); border-color: var(--green-mid); color: #fff; box-shadow: 0 2px 8px rgba(61,122,82,0.35); }

    .seat-group { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; }
    .seat-btn {
      width: 38px; height: 32px; /* 稍微變寬適應大寬度 */
      border: 1.5px solid #e8d5bb; border-radius: 8px;
      background: var(--cream); color: var(--text-mid); font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
    }
    .seat-btn:hover { border-color: var(--green-mid); color: var(--green-mid); background: #e8f5ee; }
    .seat-btn.active { background: var(--green-mid); border-color: var(--green-mid); color: #fff; }

    .name-input {
      width: 100%; padding: 10px 16px; border: 1.5px solid #e8d5bb; border-radius: 12px;
      font-size: 0.95rem; color: var(--text-dark); background: var(--cream);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .name-input:focus { border-color: var(--green-mid); box-shadow: 0 0 0 3px rgba(61,122,82,0.15); }

    .consent-group {
      margin-top: 16px; display: flex; flex-direction: column; gap: 8px;
      background: #f9f9f9; padding: 10px 16px; border-radius: 12px; border: 1px dashed #e0e0e0;
    }
    .consent-label {
      display: flex; align-items: flex-start; font-size: 0.85rem; color: var(--text-mid);
      cursor: pointer; line-height: 1.4; font-weight: 600;
    }
    .consent-label input[type="checkbox"] {
      margin-right: 10px; margin-top: 2px; width: 16px; height: 16px;
      accent-color: var(--green-mid); cursor: pointer; flex-shrink: 0;
    }

    #login-btn {
      width: 100%; padding: 14px; margin-top: 18px;
      background: var(--green-mid); color: #fff;
      font-size: 1rem; font-weight: 800; border: none; border-radius: 16px;
      cursor: pointer; letter-spacing: 0.04em;
      transition: background 0.2s, transform 0.12s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(61,122,82,0.35);
    }
    #login-btn:hover  { background: var(--bg-deep); }
    #login-btn:active { transform: scale(0.98); }

    /* ══════════════ CHAT ══════════════ */
    #chat-screen {
      display: none;
      flex-direction: column;
      width: 100%; 
      max-width: 850px; /* 加寬對話畫面 */
      height: 100vh;
      background: var(--warm-white);
      box-shadow: var(--shadow-card);
    }

    /* 針對平板以上的橫向畫面優化：讓對話框變成懸浮視窗 */
    @media (min-width: 768px) {
      #chat-screen {
        height: 92vh;
        border-radius: 24px;
        overflow: hidden;
      }
      body { padding: 20px; }
    }

    .chat-header {
      background: linear-gradient(135deg, #2d5a3d 0%, #1e3d2a 100%);
      border-bottom: 1.5px solid #1a3325;
      padding: 14px 24px; display: flex; align-items: center; gap: 14px;
    }
    .header-name-block { flex: 1; }
    .header-title { font-size: 1.2rem; font-weight: 800; color: #ffffff; }
    .header-title span { color: #7fcf9a; }
    .header-sub { font-size: 0.8rem; color: #9ecfb0; margin-top: 2px; }

    .turn-badge {
      background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 20px; padding: 4px 14px; font-size: 0.85rem; font-weight: 700; color: #c5ecd5;
    }

    #chat-history {
      flex: 1; overflow-y: auto; padding: 24px 20px; background: #f0f7f2;
      display: flex; flex-direction: column; gap: 8px;
    }
    #chat-history::-webkit-scrollbar { width: 6px; }
    #chat-history::-webkit-scrollbar-thumb { background: #b5d4c0; border-radius: 6px; }

    .bubble-row { display: flex; align-items: flex-end; gap: 10px; animation: popIn 0.22s ease-out both; }
    .bubble-row.user-row { flex-direction: row-reverse; }

    @keyframes popIn {
      from { opacity:0; transform:scale(0.95) translateY(8px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }

    .bubble {
      max-width: 75%; padding: 12px 18px; border-radius: 18px; line-height: 1.7;
      font-size: 0.95rem; word-wrap: break-word; box-shadow: var(--shadow-soft);
    }
    .user-bubble { background: var(--green-mid); border-bottom-right-radius: 4px; color: #ffffff; }
    .ai-bubble { background: var(--ai-bubble); border-bottom-left-radius: 4px; color: var(--text-dark); border: 1px solid #d4e8da; }
    .ai-bubble p  { margin-bottom: 8px; }
    .ai-bubble p:last-child { margin-bottom: 0; }
    .ai-bubble ul { margin: 6px 0 0 18px; }
    .ai-bubble li { margin-bottom: 7px; }

    .typing-indicator { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }

    .avatar-icon-sm {
      width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; padding: 4px;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      display: flex; align-items: center; justify-content: center;
    }
    .user-avatar {
      width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%;
      background: var(--green-light); border: 1.5px solid var(--green-mid);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }

    #status-msg {
      display: none; text-align: center; font-size: 0.9rem; color: #1e4a2a;
      background: #c5e8d0; padding: 10px 16px; border-top: 1px solid #9ecfb0; font-weight: 600;
    }

    .input-area {
      display: flex; align-items: center; padding: 14px 18px;
      background: #e8f5ee; border-top: 1.5px solid #b5d4c0; gap: 12px;
    }
    .input-area input {
      flex: 1; padding: 12px 20px; border: 1.5px solid #b5d4c0; border-radius: 24px;
      font-size: 1rem; background: var(--warm-white); outline: none; color: var(--text-dark);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-area input:focus { border-color: var(--green-mid); box-shadow: 0 0 0 3px rgba(61,122,82,0.12); }
    .input-area input:disabled { background: #d4eadb; cursor: not-allowed; color: var(--text-muted); }

    #send-btn {
      width: 48px; height: 48px; flex-shrink: 0; background: var(--green-mid); color: #fff;
      border: none; border-radius: 50%; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.18s, transform 0.1s, box-shadow 0.18s;
      box-shadow: 0 3px 10px rgba(61,122,82,0.35);
    }
    #send-btn:hover  { background: var(--bg-deep); }
    #send-btn:active { transform: scale(0.92); }
    #send-btn:disabled { background: #b5d4c0; box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- ═══════════ 登入畫面 ═══════════ -->
<div id="login-screen">
  <div class="login-hero">
    <div class="avatar-icon-lg">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
        <!-- 耳朵與毛茸茸的臉 -->
        <path d="M15 15 L32 35 Q50 28 68 35 L85 15 L78 42 Q92 65 75 85 Q50 95 25 85 Q8 65 22 42 Z" fill="#ffffff" stroke="#dcdcdc" stroke-width="3" stroke-linejoin="round"/>
        <!-- 黃色眼珠 -->
        <circle cx="38" cy="55" r="7" fill="#FFD700" />
        <circle cx="62" cy="55" r="7" fill="#FFD700" />
        <!-- 細長瞳孔 -->
        <ellipse cx="38" cy="55" rx="2" ry="6" fill="#222" />
        <ellipse cx="62" cy="55" rx="2" ry="6" fill="#222" />
        <!-- 粉色鼻子 -->
        <path d="M47 68 L53 68 L50 73 Z" fill="#FFA07A" />
      </svg>
    </div>
    <h1>Chat <span>Silomo</span></h1>
    <h2>Climate.Change</h2>
    <p>你的AI學習夥伴</p>
  </div>

  <span class="field-label">年級</span>
  <div class="btn-group" id="grade-group">
    <button class="sel-btn" onclick="selectGrade(this,3)">3年級</button>
    <button class="sel-btn" onclick="selectGrade(this,4)">4年級</button>
    <button class="sel-btn" onclick="selectGrade(this,5)">5年級</button>
    <button class="sel-btn" onclick="selectGrade(this,6)">6年級</button>
  </div>

  <span class="field-label">班級</span>
  <div class="btn-group" id="class-group">
    <button class="sel-btn" onclick="selectClass(this,1)">1班</button>
    <button class="sel-btn" onclick="selectClass(this,2)">2班</button>
    <button class="sel-btn" onclick="selectClass(this,3)">3班</button>
    <button class="sel-btn" onclick="selectClass(this,4)">4班</button>
    <button class="sel-btn" onclick="selectClass(this,5)">5班</button>
  </div>

  <span class="field-label">座號</span>
  <div class="seat-group" id="seat-group"></div>

  <span class="field-label">姓名</span>
  <input class="name-input" type="text" id="studentName" placeholder="例如：王大明">

  <div class="consent-group">
    <label class="consent-label">
      <input type="checkbox" id="consent-ai">
      <span>Chat Silomo是AI，可能會出錯。</span>
    </label>
    <label class="consent-label">
      <input type="checkbox" id="consent-record">
      <span>你與Chat Silomo的對話紀錄，老師都可以查閱。</span>
    </label>
  </div>

  <button id="login-btn" onclick="startChat()">進入 Chat Silomo</button>
</div>

<!-- ═══════════ 聊天畫面 ═══════════ -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="avatar-icon-sm" style="box-shadow:none; padding: 0;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
        <path d="M15 15 L32 35 Q50 28 68 35 L85 15 L78 42 Q92 65 75 85 Q50 95 25 85 Q8 65 22 42 Z" fill="#ffffff" stroke="#dcdcdc" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="38" cy="55" r="7" fill="#FFD700" />
        <circle cx="62" cy="55" r="7" fill="#FFD700" />
        <ellipse cx="38" cy="55" rx="2" ry="6" fill="#222" />
        <ellipse cx="62" cy="55" rx="2" ry="6" fill="#222" />
        <path d="M47 68 L53 68 L50 73 Z" fill="#FFA07A" />
      </svg>
    </div>
    <div class="header-name-block">
      <div class="header-title">Chat <span>Silomo</span></div>
      <div class="header-sub" id="display-user"></div>
    </div>
    <div class="turn-badge" id="turn-badge">第 1 / 4 次</div>
  </div>

  <div id="chat-history"></div>
  
  <div id="status-msg"></div>

  <div class="input-area">
    <input type="text" id="chat-input" placeholder="請輸入您的問題…">
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  let selectedGrade = 0;
  let selectedClass = 0;
  let selectedSeat  = 0;
  let userInfo = {};
  let turnCount = 1;
  let conversationHistory = [];
  const MAX_TURNS = 4;

  const catSvgString = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
      <path d="M15 15 L32 35 Q50 28 68 35 L85 15 L78 42 Q92 65 75 85 Q50 95 25 85 Q8 65 22 42 Z" fill="#ffffff" stroke="#dcdcdc" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="38" cy="55" r="7" fill="#FFD700" />
      <circle cx="62" cy="55" r="7" fill="#FFD700" />
      <ellipse cx="38" cy="55" rx="2" ry="6" fill="#222" />
      <ellipse cx="62" cy="55" rx="2" ry="6" fill="#222" />
      <path d="M47 68 L53 68 L50 73 Z" fill="#FFA07A" />
    </svg>`;

  // 建立座號按鈕 1~34
  (function buildSeats() {
    const g = document.getElementById('seat-group');
    for (let i = 1; i <= 34; i++) {
      const btn = document.createElement('button');
      btn.className = 'seat-btn';
      btn.textContent = i;
      btn.onclick = () => selectSeat(btn, i);
      g.appendChild(btn);
    }
  })();

  function selectGrade(btn, val) {
    document.querySelectorAll('#grade-group .sel-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedGrade = val;
  }
  function selectClass(btn, val) {
    document.querySelectorAll('#class-group .sel-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedClass = val;
  }
  function selectSeat(btn, val) {
    document.querySelectorAll('#seat-group .seat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedSeat = val;
  }

  function formatClassNum() {
    return `${selectedGrade}0${selectedClass}`;
  }

  function startChat() {
    const n = document.getElementById('studentName').value.trim();
    if (!selectedGrade) { alert('請選擇年級！'); return; }
    if (!selectedClass) { alert('請選擇班級！'); return; }
    if (!selectedSeat)  { alert('請選擇座號！'); return; }
    if (!n)             { alert('請輸入姓名！'); return; }
    
    // 驗證勾選事項
    const checkAI = document.getElementById('consent-ai').checked;
    const checkRecord = document.getElementById('consent-record').checked;
    if (!checkAI || !checkRecord) {
      alert('請詳閱並勾選所有的注意事項，才能進入 Chat Silomo！');
      return;
    }

    const classNum = formatClassNum();
    userInfo = { classNum, seatNum: selectedSeat, studentName: n };
    document.getElementById('display-user').innerText = `${classNum} 班・${selectedSeat} 號・${n}`;

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display  = 'flex';

    addAiBubble('<p>你好！我是 <b>Silomo</b></p><p>這次學習任務你有 <b>4 次</b>對話機會！請開始吧！</p>', true);
    setTimeout(() => document.getElementById('chat-input').focus(), 100);
  }

  // ── Cat Silomo 泡泡 ──
  function addAiBubble(content, isHTML) {
    const history = document.getElementById('chat-history');
    const row = document.createElement('div');
    row.className = 'bubble-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar-icon-sm';
    avatar.innerHTML = catSvgString;

    const bubble = document.createElement('div');
    bubble.className = 'bubble ai-bubble';
    if (isHTML) bubble.innerHTML = content;
    else        bubble.innerText  = content;

    row.appendChild(avatar);
    row.appendChild(bubble);
    history.appendChild(row);
    history.scrollTop = history.scrollHeight;
    return row;
  }

  // ── 使用者泡泡 ──
  function addUserBubble(content) {
    const history = document.getElementById('chat-history');
    const row = document.createElement('div');
    row.className = 'bubble-row user-row';

    const avatar = document.createElement('div');
    avatar.className = 'user-avatar';
    avatar.textContent = '🐾';

    const bubble = document.createElement('div');
    bubble.className = 'bubble user-bubble';
    bubble.innerText = content;

    row.appendChild(avatar);
    row.appendChild(bubble);
    history.appendChild(row);
    history.scrollTop = history.scrollHeight;
  }

  // ── 載入動畫泡泡 ──
  function addLoadingBubble() {
    const history = document.getElementById('chat-history');
    const row = document.createElement('div');
    row.className = 'bubble-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar-icon-sm';
    avatar.innerHTML = catSvgString;

    const bubble = document.createElement('div');
    bubble.className = 'bubble ai-bubble typing-indicator';
    bubble.innerText = 'Silomo 正在思考中…';

    row.appendChild(avatar);
    row.appendChild(bubble);
    history.appendChild(row);
    history.scrollTop = history.scrollHeight;
    return row;
  }

  function updateBadge() {
    const badge = document.getElementById('turn-badge');
    if (turnCount > MAX_TURNS) {
      badge.textContent = '已結束';
      badge.style.background = 'rgba(255,255,255,0.08)';
      badge.style.color = '#f0c0a0';
    } else {
      badge.textContent = `第 ${turnCount} / ${MAX_TURNS} 次`;
    }
  }

  function sendMessage() {
    if (turnCount > MAX_TURNS) return;

    const input   = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const msg     = input.value.trim();
    if (!msg) return;

    input.value = '';
    input.disabled   = true;
    sendBtn.disabled = true;

    addUserBubble(msg);
    const loadingRow = addLoadingBubble();

    conversationHistory.push({ role: "user", parts: msg });

    google.script.run
      .withSuccessHandler(res => {
        loadingRow.remove();

        if (res.status === 'success') {
          let finalHtml = "";
          try {
            const aiData = JSON.parse(res.ai_response);
            if (aiData.summary) {
              finalHtml += `<p>${aiData.summary}</p>`;
            }
            if (aiData.details && Array.isArray(aiData.details) && aiData.details.length > 0) {
              finalHtml += "<ul>";
              aiData.details.forEach(item => {
                if (item.point && item.description) {
                  finalHtml += `<li><b>${item.point}：</b>${item.description}</li>`;
                }
              });
              finalHtml += "</ul>";
            }
            if (!finalHtml) finalHtml = res.ai_response.replace(/\n/g, '<br>');
          } catch (e) {
            finalHtml = res.ai_response.replace(/\n/g, '<br>');
          }

          addAiBubble(finalHtml, true);
          conversationHistory.push({ role: "model", parts: res.ai_response });

          turnCount++;
          updateBadge();

          if (turnCount > MAX_TURNS) {
            const statusBox = document.getElementById('status-msg');
            statusBox.innerText = '⚠️ 已達到本次任務的 4 次互動上限，無法繼續發問。';
            statusBox.style.display = 'block';
            input.placeholder = '互動已結束';
          } else {
            input.disabled   = false;
            sendBtn.disabled = false;
            input.focus();
          }

        } else {
          addAiBubble('發生錯誤：' + res.message, false);
          conversationHistory.pop();
          input.disabled   = false;
          sendBtn.disabled = false;
        }
      })
      .withFailureHandler(err => {
        loadingRow.remove();
        addAiBubble('系統連線失敗，請稍後再試。', false);
        conversationHistory.pop();
        input.disabled   = false;
        sendBtn.disabled = false;
      })
      .handleChatLogic(userInfo, msg, turnCount, conversationHistory);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('chat-input')
      .addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) sendMessage();
      });
  });
</script>
</body>
</html>
